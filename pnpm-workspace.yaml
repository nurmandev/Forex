packages:
  - '.'

overrides:
  vite: 6.3.5
  # Keep React type packages aligned with the React 18 runtime so only one
  # copy of @types/react is installed (v19 breaks JSX component typing).
  '@types/react': 18.3.12
  '@types/react-dom': 18.3.1

# Build scripts required by these packages (native binaries).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
